<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LangChain Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Markdown -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

    <!-- HTML Sanitizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='index.css') }}" />
  </head>

  <body class="vh-100 overflow-hidden">
    <div class="container-fluid h-100 p-0">
      <div id="chat-container" class="d-flex flex-column h-100">
        <!-- Header -->

        <header class="navbar navbar-dark bg-dark px-4 py-3 shadow">
          <span class="navbar-brand mb-0 h4"> LANGCHAIN AI CORE </span>
        </header>

        <!-- Messages -->

        <div id="messages" class="flex-grow-1 overflow-auto p-3"></div>

        <!-- Typing Indicator -->

        <div id="typing-indicator" class="px-3 py-2 text-secondary" style="display: none">
          <span class="text-primary me-2">●</span>

          AI is processing...
        </div>

        <!-- Input -->

        <form id="input-area" class="border-top bg-body p-3" onsubmit="sendMessage(event)">
          <div class="input-group">
            <input id="messageText" type="text" class="form-control" placeholder="Ask a question..." autocomplete="off" />

            <button class="btn btn-primary" type="submit">Send</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const ws = new WebSocket("wss://excusable-fiscally-confiding.ngrok-free.dev/ws/chat");

      const typingIndicator = document.getElementById("typing-indicator");

      marked.setOptions({
        breaks: true,
        gfm: true,
      });

      ws.onmessage = function (event) {
        typingIndicator.style.display = "none";
        addMessage(event.data, "ai");
      };

      function addMessage(text, type) {
        const messages = document.getElementById("messages");

        const message = document.createElement("div");

        message.className = "mb-3 d-flex " + (type === "user" ? "justify-content-end" : "justify-content-start");

        const bubble = document.createElement("div");

        bubble.className = "p-3 rounded shadow-sm";

        bubble.style.maxWidth = "80%";

        if (type === "user") {
          bubble.classList.add("bg-primary", "text-white");

          bubble.textContent = text;
        } else {
          bubble.classList.add("bg-light", "text-dark");

          let formatted = text.replace(/^AI:\s*/, "").trim();

          formatted = formatted.replace(/(\d+\.)\s+/g, "\n$1 ");

          formatted = formatted.replace(/\s*([-*])\s+/g, "\n$1 ");

          bubble.innerHTML = DOMPurify.sanitize(marked.parse(formatted));
        }

        message.appendChild(bubble);

        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
      }

      function sendMessage(event) {
        event.preventDefault();

        const input = document.getElementById("messageText");

        if (!input.value.trim()) return;

        addMessage(input.value, "user");

        ws.send(input.value);

        input.value = "";

        input.focus();

        typingIndicator.style.display = "block";
      }

      document.getElementById("messageText").focus();
    </script>
  </body>
</html>
